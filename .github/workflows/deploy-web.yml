name: deploy-web
# Free PWA hosting on Cloudflare Pages.
#  - push to main: production.
#  - push to draft/phase1 (the testing branch): deployed to the production address too, so the Commander's testers can open
#    https://<project>.pages.dev. This stops the day the draft is merged and main takes over.
#  - any other branch: a preview address.
# GitHub's "Run workflow" button lists only workflows that exist on the default branch, so this also runs on push.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and variables CF_PAGES_PROJECT,
# EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY (the anon key is public by design; it is baked in at build time).
on:
  push:
    branches: [main, draft/phase1]
    paths-ignore: ['docs/**', '**/*.md', 'store/**']   # a docs-only change does not need a new deployment
  workflow_dispatch:
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # which Cloudflare branch this push becomes: the testing branch is served as production
      PAGES_BRANCH: ${{ github.ref_name == 'draft/phase1' && 'main' || github.ref_name }}
    steps:
      - name: Check configuration (names only, never values)
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Not configured, so nothing was deployed. Missing:$missing"
            echo "Missing:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Configuration present. Deploying branch '$PAGES_BRANCH' to project '$CF_PAGES_PROJECT'." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @vk/mobile export:web
        env: { CI: '1' }
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy apps/mobile/dist --project-name="$CF_PAGES_PROJECT" --branch="$PAGES_BRANCH" --commit-dirty=true
